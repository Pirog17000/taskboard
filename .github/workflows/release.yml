name: Release

# Сборка релиза по тегу vX.Y.Z: тесты, бинарники под Linux, macOS и Windows (amd64 и arm64), GitHub Release с архивами и SHA-256.
# SQLite здесь на чистом Go (modernc.org/sqlite), поэтому все платформы собираются кросс-компиляцией с одного Linux-раннера.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check that the tag matches the version in code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)
          if [ "$tag" != "$code" ]; then
            echo "::error::Tag v$tag does not match internal/version/version.go ($code)"
            exit 1
          fi

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Embed frontend in binary
        run: |
          mkdir -p cmd/taskboard/web/dist
          cp -r web/dist/* cmd/taskboard/web/dist/

      - name: Run Go tests
        run: go test ./...

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="taskboard-${goos}-${goarch}"
            bin="taskboard"
            [ "$goos" = "windows" ] && bin="taskboard.exe"

            mkdir -p "build/$name"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags="-s -w" -o "build/$name/$bin" ./cmd/taskboard
            cp LICENSE README.md "build/$name/"

            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../release/$name.zip" "$name")
            else
              tar -C build -czf "release/$name.tar.gz" "$name"
            fi
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
